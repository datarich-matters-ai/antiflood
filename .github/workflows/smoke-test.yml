# Manual check that the live site loads data and map tiles.
name: smoke-test

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright-core@1.56.1
      - run: node scripts/smoke-test.mjs
