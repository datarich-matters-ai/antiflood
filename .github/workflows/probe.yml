# Temporary: inspect freshness of published data (to be removed).
name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3; do
            curl -sS -H 'Cache-Control: no-cache' "https://datarich-matters-ai.github.io/antiflood/data/waterlevel.json?nocache=$RANDOM" -o w.json -D h.txt
            echo "site updated: $(jq -r .updated w.json) | $(grep -iE '^(age|last-modified|x-cache):' h.txt | tr -d '\r' | tr '\n' ' ')"
            sleep 5
          done
