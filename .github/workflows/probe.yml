# Temporary: checks which flood-road data sources respond (to be removed).
name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Traffy share API document
        run: |
          curl -sSL -m 40 "https://www.traffy.in.th/?page_id=4434" -o doc.html
          python3 - <<'PY'
          import re,html
          t=open('doc.html',encoding='utf-8',errors='ignore').read()
          t=re.sub(r'<script.*?</script>|<style.*?</style>','',t,flags=re.S)
          t=html.unescape(re.sub(r'<[^>]+>',' ',t)); t=re.sub(r'\s+',' ',t)
          i=t.find('share'); 
          for m in re.finditer(r'publicapi|v2/search|v2/geojson|parameter|พารามิเตอร์',t):
              print('...',t[max(0,m.start()-200):m.start()+600]); print()
          PY
      - name: Try v2 endpoints
        run: |
          T=$(python3 -c "import urllib.parse;print(urllib.parse.quote('น้ำท่วม'))")
          for q in "v2/search?limit=2" "v2/search?limit=2&text=$T" "v2/search?limit=2&problem_type_abdul=$T" "v2/geojson?limit=2&text=$T"; do
            echo "=== $q"; curl -sS -m 60 -w "\n[%{http_code} %{time_total}s %{size_download}B]\n" "https://publicapi.traffy.in.th/share/$q" | head -c 2500; echo; done
