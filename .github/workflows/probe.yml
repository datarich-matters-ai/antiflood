# Temporary: checks which free weather sources respond (to be removed).
name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: RainViewer
        run: |
          curl -sS https://api.rainviewer.com/public/weather-maps.json | tee rv.json | head -c 1500; echo
          path=$(jq -r '.radar.past[-1].path' rv.json); host=$(jq -r .host rv.json)
          for z in 5 7 8 10; do curl -sS -o t.png -w "radar z$z %{http_code} %{size_download}B\n" "$host$path/256/$z/$((z==5?25:z==7?101:z==8?202:809))/$((z==5?14:z==7?57:z==8?114:457))/2/1_1.png"; done
          echo "nowcast frames: $(jq '.radar.nowcast | length' rv.json)  satellite: $(jq -c '.satellite' rv.json | head -c 200)"
      - name: Open-Meteo
        run: curl -sS "https://api.open-meteo.com/v1/forecast?latitude=19.9&longitude=99.8&hourly=precipitation,precipitation_probability&minutely_15=precipitation&forecast_days=1&timezone=Asia%2FBangkok" | head -c 1200; echo
      - name: NASA GIBS Himawari
        run: |
          curl -sS "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/wmts.cgi?SERVICE=WMTS&REQUEST=GetCapabilities" -o caps.xml
          grep -o '<ows:Identifier>Himawari[^<]*' caps.xml | sort -u | head -20
          grep -A40 '<ows:Identifier>Himawari_AHI_Band13_Clean_Infrared</ows:Identifier>' caps.xml | grep -E 'Default|TileMatrixSet>|ResourceURL|Dimension' | head -10
      - name: GDACS tropical cyclones
        run: curl -sS "https://www.gdacs.org/gdacsapi/api/events/geteventlist/SEARCH?eventlist=TC&alertlevel=Green;Orange;Red" | head -c 1500; echo
