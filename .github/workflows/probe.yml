# Temporary: checks which flood-road data sources respond (to be removed).
name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Traffy map.js endpoints
        run: |
          curl -sSL -m 30 https://apitest2.traffy.in.th/js/map.js -o map.js
          grep -nE 'base_url_api|publicapi|url_[a-z_]+ *=|axios\.(get|post)|fetch\(' map.js | cut -c1-260 | head -40
      - name: Try geojson endpoints
        run: |
          for p in $(grep -oE 'base_url_api *\}?[`"+ ]*[^`"]*' map.js | grep -oE '/teamchadchart/[A-Za-z0-9_/?=&.-]+' | sort -u | head -8); do
            echo "=== $p"; curl -sS -m 45 -w "\n[%{http_code} %{time_total}s %{size_download}B]\n" "https://publicapi.traffy.in.th/share$p" | head -c 700; echo; done
