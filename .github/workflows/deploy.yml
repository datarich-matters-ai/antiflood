# Refreshes water-level data from ThaiWater and deploys the app to GitHub Pages.
# Scheduled runs only fire on the default branch.
name: update-and-deploy

on:
  push:
    branches: [main, claude/keen-fermi-b7enci]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # lets each run queue the next refresh

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Fetch water levels and dams
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/fetch-data.mjs public/data
      - name: Read help-request form
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/sos-form.mjs public/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub's cron schedule is best-effort and can go hours without firing, so
  # each run also queues the next one about 5 minutes after it started. The
  # check stops a second chain from forming if a scheduled run joins in.
  next-refresh:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Queue next refresh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sleep 180
          others=$(gh run list --workflow deploy.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status != \"completed\")] | length")
          if [ "$others" -eq 0 ]; then
            gh workflow run deploy.yml --ref "${{ github.ref_name }}"
            echo "queued next refresh"
          else
            echo "another refresh is already pending; not queuing"
          fi
