# Refreshes water-level data from ThaiWater and deploys the app to GitHub Pages.
# Scheduled runs only fire on the default branch.
name: update-and-deploy

on:
  push:
    branches: [main, claude/keen-fermi-b7enci]
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Fetch water levels
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if ! node scripts/fetch-waterlevel.mjs public/data/waterlevel.json; then
            echo "::warning::ThaiWater fetch failed; redeploying last published data"
            mkdir -p public/data
            curl -sfL "$PAGES_URL/data/waterlevel.json" -o public/data/waterlevel.json
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
